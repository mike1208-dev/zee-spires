<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Space Grotesk', Inter, system-ui, sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="10%" r="90%">
      <stop offset="0" stop-color="#12101f"/>
      <stop offset="100" stop-color="#07070b"/>
    </radialGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#efe9ff"/>
      <stop offset="30%" stop-color="#b79dff"/>
      <stop offset="62%" stop-color="#7c53f0"/>
      <stop offset="100%" stop-color="#241247"/>
    </radialGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="100" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- glow + orb -->
  <circle cx="950" cy="300" r="230" fill="#8b5cf6" opacity="0.18"/>
  <circle cx="950" cy="300" r="140" fill="url(#orb)"/>
  <circle cx="950" cy="300" r="140" fill="none" stroke="#a78bfa" stroke-opacity="0.4"/>

  <!-- eyebrow -->
  <text x="96" y="235" font-size="22" font-weight="600" letter-spacing="5" fill="#a78bfa">AI-NATIVE SOFTWARE STUDIO</text>

  <!-- headline -->
  <text x="94" y="330" font-size="84" font-weight="500" fill="#8a8a9c" letter-spacing="-2">Software built to</text>
  <text x="94" y="426" font-size="84" font-weight="500" letter-spacing="-2">reach <tspan fill="url(#grad)">higher.</tspan></text>

  <!-- subline -->
  <text x="96" y="500" font-size="27" fill="#9b9caf">AI Agents · Data Engineering · Full-Stack · IT Consulting &amp; Staffing</text>

  <text x="96" y="566" font-size="21" font-weight="600" fill="#6a6b80" letter-spacing="1">ZeeSpires US LLC</text>
</svg>
